[project]
name = "model-painter"
license = "MIT"
version = "0.1.0"
description = "Local tool for AI-assisted multi-colour painting of 3D print models"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
painter = "painter.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/painter"]
sources = ["backend"]
